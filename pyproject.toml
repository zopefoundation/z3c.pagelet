# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[build-system]
requires = [
    "setuptools >= 78.1.1,< 82",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "z3c.pagelet"
version = "4.1.dev0"
description = "Pagelets are way to specify a template without the O-wrap."
license = "ZPL-2.1"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Framework :: Zope :: 3",
]
dynamic = ["readme"]
requires-python = ">=3.11"
authors = [
    {name = "Roger Ineichen and the Zope Community",email = "zope-dev@zope.dev"},
]
maintainers = [
    {name = "Plone Foundation and contributors",email = "zope-dev@zope.dev"},
]
dependencies = [
    "z3c.template>=1.2.0",
    "zope.browserpage",
    "zope.component>=3.7.0",
    "zope.configuration",
    "zope.contentprovider",
    "zope.interface",
    "zope.publisher",
    "zope.schema",
    "zope.security",
]
keywords = [
    "zope3",
    "template",
    "pagelet",
    "layout",
    "zpt",
    "pagetemplate",
]
[project.optional-dependencies]
test = [
    "zope.formlib",
    "zope.site",
    "zope.testing",
    "zope.testrunner >= 6.4",
    "zope.traversing",
    "lxml",
    "z3c.pt >= 2.1",
    "z3c.ptcompat >= 1.0",
]
chameleon = [
    "z3c.pt >= 2.1",
    "z3c.ptcompat",
]
forms = [
    "zope.formlib"
]
docs = [
    "z3c.recipe.sphinxdoc"
]

[project.urls]
Source = "https://github.com/zopefoundation/z3c.pagelet"
Issues = "https://github.com/zopefoundation/z3c.pagelet/issues"
Changelog = "https://raw.githubusercontent.com/zopefoundation/z3c.pagelet/master/CHANGES.rst"

[tool.coverage.run]
branch = true
source = ["z3c.pagelet"]

[tool.coverage.report]
fail_under = 84.5
precision = 2
ignore_errors = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "self.fail",
    "raise AssertionError",
    "raise unittest.Skip",
]

[tool.coverage.html]
directory = "parts/htmlcov"

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "src/z3c/pagelet/README.rst", "CHANGES.rst"]}

[tool.zest-releaser]
create-wheel = false
extra-message = ""
upload-pypi = false
